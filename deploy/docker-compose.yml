services:
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before starting Pro Chat}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting Pro Chat}
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
    expose:
      - "3000"
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
