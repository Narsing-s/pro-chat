services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_FILE: /app/data/pro-chat.json
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    volumes:
      - prochat-data:/app/data
    ports:
      - "3000:3000"
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  prochat-data:
