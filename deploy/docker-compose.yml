services:
  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_FILE: /app/data/pro-chat.json
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting Pro Chat}
    volumes:
      - prochat-data:/app/data
    expose:
      - "3000"
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  prochat-data:
