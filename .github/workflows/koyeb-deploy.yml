name: Deploy Pro Chat API to Koyeb

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy from GitHub to Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          api-token: ${{ secrets.KOYEB_API_TOKEN }}
          app-name: pro-chat
          service-name: api
          git-url: github.com/Narsing-s/pro-chat
          git-branch: main
          git-builder: docker
          git-docker-dockerfile: apps/server/Dockerfile.koyeb
          ports: 3000:http
          routes: /:3000
          instance-type: free
          env: |
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=3000
            DATABASE_URL=${{ secrets.PRO_CHAT_DATABASE_URL }}
            SESSION_SECRET=${{ secrets.PRO_CHAT_SESSION_SECRET }}
            WEB_ORIGIN=${{ secrets.PRO_CHAT_WEB_ORIGIN }}
            WEBAUTHN_RP_NAME=Pro Chat
            REQUIRE_EMAIL_VERIFICATION=false
            REQUIRE_PHONE_VERIFICATION=false
            REQUIRE_DEVICE_APPROVAL=false
