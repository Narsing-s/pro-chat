name: Add message realtime handlers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/add-message-realtime-handlers.py
      - run: |
          rm -f scripts/add-message-realtime-handlers.py .github/workflows/add-message-realtime-handlers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.jsx
          git add -u scripts/add-message-realtime-handlers.py .github/workflows/add-message-realtime-handlers.yml
          git commit -m "fix: sync message operations in realtime"
          git push origin main
