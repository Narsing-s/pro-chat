name: Pro Chat Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only. The deployment job gets the Pages permissions it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.PRO_CHAT_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - name: Write public API runtime config
        run: |
          if [ -n "$VITE_API_URL" ]; then
            printf 'window.__PRO_CHAT_API__=%s;\n' "$(printf '%s' "$VITE_API_URL" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > apps/web/public/runtime-config.js
          else
            printf 'window.__PRO_CHAT_API__="";\n' > apps/web/public/runtime-config.js
          fi
      - run: npm install
      - run: npm run build -w apps/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
