name: Repair message operation syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-message-operation-syntax.py
      - run: |
          rm -f scripts/fix-message-operation-syntax.py .github/workflows/fix-message-operation-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/server.ts
          git add -u scripts/fix-message-operation-syntax.py .github/workflows/fix-message-operation-syntax.yml
          git commit -m "fix: repair message operation socket syntax"
          git push origin main
