name: Pro Chat Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_API_URL: ${{ vars.PRO_CHAT_API_URL }}

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w apps/server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair MessageBubble JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('apps/web/src/main.jsx')
          s=p.read_text(encoding='utf-8')
          start=s.index('function MessageBubble(')
          end=s.index('function AttachmentMenu(', start)
          replacement='''function MessageBubble({m,mine,onEdit,onDelete,onReply,onStar,onReact,onPin,onForward,onInfo,starred,selected,setSelected}){const[open,setOpen]=useState(false);return <div className={`bubble-row ${mine?'mine':''}`}><div className={`bubble ${m.deleted?'deleted':''} ${selected?'selected':''}`} onContextMenu={e=>{e.preventDefault();setOpen(v=>!v)}} onClick={()=>setSelected(m.id)}><div className="bubble-text">{m.deleted?'This message was deleted':m.text}</div>{m.replyTo&&<div className="quoted">↩ Replied message</div>}<small>{m.edited&&'Edited · '}{new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} {mine&&(m.read?<CheckCheck size={13}/>:<Check size={13}/>)}</small>{open&&<div className="message-menu"><button onClick={()=>{onReply(m);setOpen(false)}}><Reply/> Reply</button><button onClick={()=>{onStar(m);setOpen(false)}}><Star/> {starred?'Unstar':'Star'}</button><button onClick={()=>{navigator.clipboard?.writeText(m.text);setOpen(false)}}><FileText/> Copy</button><button onClick={()=>{onForward(m);setOpen(false)}}><Forward/> Forward</button><button onClick={()=>{onReact(m);setOpen(false)}}>❤️ React</button><button onClick={()=>{onPin(m);setOpen(false)}}><Pin/> {m.pinned?'Unpin':'Pin'}</button><button onClick={()=>{onInfo(m);setOpen(false)}}><Eye/> Message info</button>{mine&&!m.deleted&&<><button onClick={()=>{onEdit(m);setOpen(false)}}><Edit3/> Edit</button><button onClick={()=>{onDelete(m,false);setOpen(false)}}><Trash2/> Delete for me</button><button onClick={()=>{onDelete(m,true);setOpen(false)}}><Trash2/> Delete for everyone</button></>}<button onClick={()=>setOpen(false)}><Flag/> Report</button></div>}</div></div>}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.jsx
          git diff --cached --quiet || git commit -m "fix(web): simplify MessageBubble action JSX"
          git diff --cached --quiet || git push origin main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write public API runtime config
        run: |
          if [ -n "$VITE_API_URL" ]; then
            printf 'window.__PRO_CHAT_API__=%s;\n' "$(printf '%s' "$VITE_API_URL" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > apps/web/public/runtime-config.js
          else
            printf 'window.__PRO_CHAT_API__=\"\";\n' > apps/web/public/runtime-config.js
          fi
      - run: npm install
      - run: npm run build -w apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: pro-chat-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair MessageBubble JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/main.jsx')
          s=p.read_text(encoding='utf-8')
          start=s.index('function MessageBubble(')
          end=s.index('function AttachmentMenu(', start)
          replacement='''function MessageBubble({m,mine,onEdit,onDelete,onReply,onStar,onReact,onPin,onForward,onInfo,starred,selected,setSelected}){const[open,setOpen]=useState(false);return <div className={`bubble-row ${mine?'mine':''}`}><div className={`bubble ${m.deleted?'deleted':''} ${selected?'selected':''}`} onContextMenu={e=>{e.preventDefault();setOpen(v=>!v)}} onClick={()=>setSelected(m.id)}><div className="bubble-text">{m.deleted?'This message was deleted':m.text}</div>{m.replyTo&&<div className="quoted">↩ Replied message</div>}<small>{m.edited&&'Edited · '}{new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} {mine&&(m.read?<CheckCheck size={13}/>:<Check size={13}/>)}</small>{open&&<div className="message-menu"><button onClick={()=>{onReply(m);setOpen(false)}}><Reply/> Reply</button><button onClick={()=>{onStar(m);setOpen(false)}}><Star/> {starred?'Unstar':'Star'}</button><button onClick={()=>{navigator.clipboard?.writeText(m.text);setOpen(false)}}><FileText/> Copy</button><button onClick={()=>{onForward(m);setOpen(false)}}><Forward/> Forward</button><button onClick={()=>{onReact(m);setOpen(false)}}>❤️ React</button><button onClick={()=>{onPin(m);setOpen(false)}}><Pin/> {m.pinned?'Unpin':'Pin'}</button><button onClick={()=>{onInfo(m);setOpen(false)}}><Eye/> Message info</button>{mine&&!m.deleted&&<><button onClick={()=>{onEdit(m);setOpen(false)}}><Edit3/> Edit</button><button onClick={()=>{onDelete(m,false);setOpen(false)}}><Trash2/> Delete for me</button><button onClick={()=>{onDelete(m,true);setOpen(false)}}><Trash2/> Delete for everyone</button></>}<button onClick={()=>setOpen(false)}><Flag/> Report</button></div>}</div></div>}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write public API runtime config
        run: |
          if [ -n "$VITE_API_URL" ]; then
            printf 'window.__PRO_CHAT_API__=%s;\n' "$(printf '%s' "$VITE_API_URL" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > apps/web/public/runtime-config.js
          else
            printf 'window.__PRO_CHAT_API__=\"\";\n' > apps/web/public/runtime-config.js
          fi
      - run: npm install
      - run: npm run build -w apps/web
      - run: npx cap add android
        working-directory: apps/web
      - run: npx cap sync android
        working-directory: apps/web
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Android API 36
        working-directory: apps/web/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f variables.gradle ]; then
            sed -i -E 's/(compileSdkVersion[[:space:]]*=)[[:space:]]*[0-9]+/\1 36/; s/(targetSdkVersion[[:space:]]*=)[[:space:]]*[0-9]+/\1 36/' variables.gradle
          fi
      - name: Build Android debug APK
        working-directory: apps/web/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pro-chat-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
