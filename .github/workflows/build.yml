name: Pro Chat Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_API_URL: ${{ vars.PRO_CHAT_API_URL }}

jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair message SQL template if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/server/src/server.ts')
          s=p.read_text(encoding='utf-8')
          bad='forwardedFrom"'+',[id,chatId'
          good='forwardedFrom"`'+',[id,chatId'
          if bad in s:
              p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          if ! git diff --quiet -- apps/server/src/server.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/server/src/server.ts
            git commit -m "fix: close message send SQL template literal"
            git push origin main
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w apps/server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair MessageBubble JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/main.jsx')
          s=p.read_text(encoding='utf-8')
          old='{mine&&!m.deleted&&<button onClick={()=>{onEdit(m);setOpen(false)}}><Edit3/> Edit</button><button onClick={()=>{onDelete(m,false);setOpen(false)}}><Trash2/> Delete for me</button>{mine&&<button onClick={()=>{onDelete(m,true);setOpen(false)}}><Trash2/> Delete for everyone</button>}'
          new='{mine&&!m.deleted&&<><button onClick={()=>{onEdit(m);setOpen(false)}}><Edit3/> Edit</button><button onClick={()=>{onDelete(m,false);setOpen(false)}}><Trash2/> Delete for me</button>{mine&&<button onClick={()=>{onDelete(m,true);setOpen(false)}}><Trash2/> Delete for everyone</button></>}'
          if old not in s:
              raise SystemExit('Expected MessageBubble JSX pattern was not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          if ! git diff --quiet -- apps/web/src/main.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/main.jsx
            git commit -m "fix(web): repair MessageBubble conditional JSX"
            git push origin main
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write public API runtime config
        run: |
          if [ -n "$VITE_API_URL" ]; then
            printf 'window.__PRO_CHAT_API__=%s;\n' "$(printf '%s' "$VITE_API_URL" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > apps/web/public/runtime-config.js
          else
            printf 'window.__PRO_CHAT_API__="";\n' > apps/web/public/runtime-config.js
          fi
      - run: npm install
      - run: npm run build -w apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: pro-chat-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair MessageBubble JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/main.jsx')
          s=p.read_text(encoding='utf-8')
          old='{mine&&!m.deleted&&<button onClick={()=>{onEdit(m);setOpen(false)}}><Edit3/> Edit</button><button onClick={()=>{onDelete(m,false);setOpen(false)}}><Trash2/> Delete for me</button>{mine&&<button onClick={()=>{onDelete(m,true);setOpen(false)}}><Trash2/> Delete for everyone</button>}'
          new='{mine&&!m.deleted&&<><button onClick={()=>{onEdit(m);setOpen(false)}}><Edit3/> Edit</button><button onClick={()=>{onDelete(m,false);setOpen(false)}}><Trash2/> Delete for me</button>{mine&&<button onClick={()=>{onDelete(m,true);setOpen(false)}}><Trash2/> Delete for everyone</button></>}'
          if old not in s:
              raise SystemExit('Expected MessageBubble JSX pattern was not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write public API runtime config
        run: |
          if [ -n "$VITE_API_URL" ]; then
            printf 'window.__PRO_CHAT_API__=%s;\n' "$(printf '%s' "$VITE_API_URL" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > apps/web/public/runtime-config.js
          else
            printf 'window.__PRO_CHAT_API__="";\n' > apps/web/public/runtime-config.js
          fi
      - run: npm install
      - run: npm run build -w apps/web
      - run: npx cap add android
        working-directory: apps/web
      - run: npx cap sync android
        working-directory: apps/web
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure Android API 36
        working-directory: apps/web/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f variables.gradle ]; then
            sed -i -E 's/(compileSdkVersion[[:space:]]*=)[[:space:]]*[0-9]+/\1 36/; s/(targetSdkVersion[[:space:]]*=)[[:space:]]*[0-9]+/\1 36/' variables.gradle
          fi
      - name: Build Android debug APK
        working-directory: apps/web/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pro-chat-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
