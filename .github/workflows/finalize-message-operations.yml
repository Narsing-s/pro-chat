name: Finalize message operations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python3 scripts/finalize-message-sql-quote.py
          python3 scripts/add-message-realtime-handlers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/server.ts apps/web/src/main.jsx
          git commit -m "fix: finalize realtime message operations"
          git push origin main
